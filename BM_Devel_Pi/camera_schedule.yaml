# Local deployment schedule for legacy BM camera production runtime.
#
# time_source controls where the app gets UTC for the transmit-window decision:
#   spotter_utc -> subscribe to BM/Spotter topic spotter/utc-time. Use for bmcam002.
#   rtc         -> set/read Linux time from Pi hardware RTC using hwclock. Use for bmcam001.
#   system      -> bench-only fallback; not recommended for production.
time_source: "spotter_utc"

timezone_preset: "sf"
timezone: "America/Los_Angeles"

enforce_time_window: true
enforce_spotter_time_window: true

transmit_window:
  start: "08:00"
  end: "15:00"

set_system_clock_from_spotter: true
spotter_time_timeout_seconds: 60
allow_system_clock_fallback: false
uart_port: "/dev/ttyAMA0"
baudrate: 115200

rtc:
  hwclock_path: "/usr/sbin/hwclock"
  set_system_clock_from_rtc: true
  require_plausible_after_utc: "2026-01-01T00:00:00+00:00"

# Legacy Picamera2 fallback settings. These remain for rollback by setting
# image_pipeline.enabled: false.
image:
  resolution_key: "720p"
  image_quality: 25

# DEV bmcam000 libcamera/rpicam image pipeline.
# Coordinate system: crop x/y/w/h are in native full JPEG coordinates.
# Spatial density is the output size after cropping/downsampling.
# Validated bmcam000 production candidate:
# native 4608x2592 -> fixed 3072x1728 crop -> 2688x1512 output -> HEIC Q20.
# 3072x1728 output captured successfully, but HEIC encode was unstable on bmcam000.
image_pipeline:
  enabled: true
  capture_backend: "rpicam"

  source:
    width: 4608
    height: 2592
    jpeg_quality: 95

  crop:
    mode: "fixed"
    x: 768
    y: 432
    w: 3072
    h: 1728

  spatial:
    output_width: 2688
    output_height: 1512
    resample: "lanczos"

  heic:
    quality: 20

# Sprint08 progressive-JPEG release candidate (RC). Config-gated:
#   heic             -> known-good production path (main_pi_camera.py), unchanged
#   progressive_jpeg -> RC entry script (rc_progressive_jpeg.py)
capture_mode: "heic"

# RC quality ladder + cycle budget (Sprint07 Pi-validated on bmcam000; see
# sprints/Sprint08_progressive_jpeg_rc.md section 4).
# Ladder = encode at q_max, step down by quality.step until q_min:
# defaults give 15 -> 13 -> 11 -> 9. q17+ is dead (206 msgs > 195-msg cap).
# Pacing/chunking intentionally live only in bm_serial below (single source
# of truth): image_buffer_size chars/msg, image_transmit_delay_seconds s/msg.
progressive_jpeg:
  max_run_time_min: 12     # production spec (Nick 2026-08-01, Sprint13); was 16 (field trial, S07)
  message_cap: 195         # field-tested hard cap on messages per image
  quality:
    # Field-trial multi-segment ladder (Nick 2026-07-25): 90->30 by 10,
    # ->15 by 5, ->9 by 2. The adaptive selector steps down until the frame
    # fits the cap AND the remaining budget, so a high start is safe.
    # When ladder is set it overrides q_max/q_min/step below.
    ladder: "90,80,70,60,50,40,30,25,20,15,13,11,9"
    q_max: 15              # fallback uniform ladder (S07-validated) if ladder is unset
    q_min: 9
    step: 2
  # RC frozen geometry (S07 byte-validated), separate from the HEIC
  # image_pipeline crop so flipping capture_mode never edits shared geometry.
  # Coordinates are NATIVE 4608x2592 sensor-equivalent. The default IS the
  # exact center crop ((4608-1600)/2, (2592-900)/2); the crop is fixed config
  # constants — no on-device tag detection. Card-centered bench alternative:
  # x: 1467, y: 1255.
  crop:
    x: 1504
    y: 846
    w: 1600
    h: 900
  output_width: 1000       # lanczos output width; height follows crop aspect (562)

# Sprint15 video mode (capture_mode: video). One YAML value flips a unit
# between stills and video production (SPEC constraint 10). Geometry
# (ROI + output size) is INHERITED from progressive_jpeg.crop/output_width
# above — there are NO video geometry keys (D-S15-3): the native crop box
# converts to libcamera --roi fractions, output 1000x562 becomes
# --width/--height. Values below are the SPEC-locked defaults; a missing
# island resolves to exactly these.
video:
  clip_minutes: 5          # per-clip length limit, minutes (fractional OK for bench, e.g. 0.25 = 15 s)
  fps: 15
  bitrate_mbps: 2.0        # hardware H.264 via /dev/video11; ~75 MB per 5-min clip
  session_minutes: 0       # 0 = record until power loss; >0 = N min then the NORMAL halt path
  # dir: /home/pi/BM_Devel_Pi/videos   # clip directory (default shown)
  storage:
    max_used_pct: 75       # ring cap: prune oldest clip triples past this (primary knob)
    min_free_gb: 10        # absolute hard floor backstop; stricter of the two wins
    ring_dry_run: false    # true = report what WOULD be deleted, delete nothing
  ui:
    enabled: true
    port: 8080

# Sprint16 network boot default (D-S16-3/4) — the ONE persistent piece of
# WiFi state. Runtime switches (wap 0/1/2, the GUI join form) are
# session-only: every power cycle returns to this. `ap` = open hotspot,
# SSID = hostname (the customer-ship value); `nereus_hq` = join the
# provisioned office-WiFi NM profile, falling back to the AP if it is not
# joined within ap_fallback_s (a unit can never boot unreachable).
# No island at all = WiFi left entirely to the OS (pre-Sprint16 behavior).
network:
  default: nereus_hq       # ap | nereus_hq (ship value: ap)
  ap_fallback_s: 90        # AP fallback window for a client default
  ap_timeout_min: 60       # auto-revert timer for REMOTE wap flips

# RC power-savings halt (M6 wraps tools/power/tuned_halt.sh, ~0.26 W validated).
# dry_run true logs the halt intent without halting (bench-safe default).
# Recovery from a real halt is a manual power cycle.
power_halt:
  enabled: false
  dry_run: true
  mode: "halt"             # halt | poweroff
  script_path: "/home/pi/BM_Devel_Pi/tuned_halt.sh"   # deployed copy of tools/power/tuned_halt.sh

# Bristlemouth/Sofar image-transfer settings.
# network_type:
#   0x01 / 1 = legacy sat/cell fallback queue
#   0x02 / 2 = cellular-only queue
# Sprint09-measured: 384 chars/msg (<=400 B fast-path payload), 1.0 s/msg (drain-rate floor +25%).
bm_serial:
  network_type: 0x02
  image_buffer_size: 384
  image_transmit_delay_seconds: 1.0

# Sprint10 remote command daemon (bm_commands branch). Disabled default
# is byte-identical to the Sprint08/09 cycle (D14). When enabled:
#   - persisted command state (state_path) OVERLAYS the values above
#     (progressive_jpeg.crop, camera_controls, max_run_time_min) — this
#     file is never rewritten; delete the state file to restore stock.
#   - with --transmit (or bench-only --bench-commands) a listener owns
#     the UART for the whole cycle and acks commands on the uplink.
# topic is provisional until Q11/Phase B verification.
#
# Sprint11: pre_capture_listen_s is GONE (C1/D2) — the listen moved AFTER
# the transmit, where the mailbox drain actually arrives (finding 006).
# Leaving the old key in a config is harmless but prints a loud warning.
bm_commands:
  enabled: false
  topic: "bmcam/cmd"
  post_transmit_listen_s: 150      # C4/D6 bounded tail before the halt
  defer_acks_during_transmit: false  # C3/D5: keep acks out of the burst
  state_path: "/home/pi/BM_Devel_Pi/bm_command_state.json"

# Sprint11 C2 — phase-aware transmit scheduling (rc_transmit_phase.py).
# Blackouts sit on an absolute 5-minute UTC grid (Sprint10 Phase E: 83 % of
# gaps within 30 s of a boundary, D ~ 9 s median, 24 s at p90). With this
# enabled the cycle waits so the whole burst lands inside one clean lane:
#     [boundary + post_guard, next boundary - pre_guard]  = 250 s usable
# CONFIG RULE (D3): image_transmit_delay_seconds x message_cap <= 250 s.
#   1.0 s -> 250 msgs OK    1.25 s -> 200 OK
#   1.5 s -> 166 (a 194-msg image does NOT fit)   2.0 s -> 125
# Disabled == pre-Sprint11 unscheduled transmit. A failed Spotter clock read
# also degrades to exactly that, loudly (D1).
transmit_phase:
  enabled: false
  grid_seconds: 300
  post_boundary_guard_s: 30
  pre_boundary_guard_s: 20
  max_wait_s: 300

